name: Deploy

# Ships to the same VPS as StockFlow. Everything server-side is done by deploy/server-setup.sh, run as
# root over SSH, so a fresh push is the whole procedure — there is nothing to do on the box by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-quillbridge
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # ── Build ────────────────────────────────────────────────────────────────────────────────
      - name: Test API
        run: dotnet test api/quillbridge.Tests/quillbridge.Tests.csproj --configuration Release

      - name: Publish API
        run: >
          dotnet publish api/quillbridge.api/quillbridge.api.csproj
          --configuration Release
          --output artifact/api
          -p:UseAppHost=false

      - name: Build web
        working-directory: web
        env:
          # relative: the same nginx serves the page and proxies /api
          VITE_API_URL: /api
        run: |
          npm ci
          npm run build
          test -f dist/index.html

      # ── Ship ─────────────────────────────────────────────────────────────────────────────────
      # Same credentials as StockFlow's pipeline: a key (DEPLOY_SSH_KEY) or a password
      # (DEPLOY_SSH_PASSWORD) for DEPLOY_USER, which must be root — the setup script installs a
      # systemd unit and an nginx site.
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_PASSWORD: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" || { echo "The DEPLOY_HOST secret is not set."; exit 1; }
          install -d -m 700 ~/.ssh
          ssh-keyscan -T 15 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          if [ -n "${SSH_KEY:-}" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            printf '#!/usr/bin/env bash\nexec ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes "$@"\n' > ~/.ssh/ssh-deploy
          elif [ -n "${SSH_PASSWORD:-}" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
            # from a file, not `sshpass -p`, which would show in the process list; CR stripped in
            # case the secret was pasted from a Windows clipboard
            printf '%s\n' "$SSH_PASSWORD" | tr -d '\r' > ~/.ssh/deploy_pass
            chmod 600 ~/.ssh/deploy_pass
            printf '#!/usr/bin/env bash\nexec sshpass -f "$HOME/.ssh/deploy_pass" ssh "$@"\n' > ~/.ssh/ssh-deploy
          else
            echo "Neither DEPLOY_SSH_KEY nor DEPLOY_SSH_PASSWORD is set — there is no way in."
            exit 1
          fi
          chmod 700 ~/.ssh/ssh-deploy

          if ! ~/.ssh/ssh-deploy -o ConnectTimeout=15 "${DEPLOY_USER:-root}@$DEPLOY_HOST" 'test "$(id -u)" -eq 0'; then
            echo "Could not log in as root (${DEPLOY_USER:-root}@$DEPLOY_HOST) — check DEPLOY_USER and the SSH secret."
            exit 1
          fi

      - name: Upload the release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          TARGET="${DEPLOY_USER:-root}@$DEPLOY_HOST"
          ~/.ssh/ssh-deploy "$TARGET" 'install -d -m 700 /srv/quillbridge-release'
          rsync -az --delete -e ~/.ssh/ssh-deploy artifact/api/ "$TARGET:/srv/quillbridge-release/api/"
          rsync -az --delete -e ~/.ssh/ssh-deploy web/dist/     "$TARGET:/srv/quillbridge-release/web/"
          rsync -az --delete -e ~/.ssh/ssh-deploy deploy/       "$TARGET:/srv/quillbridge-release/deploy/"

      - name: Set up the server and release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DOMAIN: ${{ vars.QB_DOMAIN }}
          CERT_EMAIL: ${{ vars.CERT_EMAIL }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        # The secrets go over the SSH session's stdin, so they never land in a file on the runner
        # or show up in the server's process list.
        run: |
          test -n "$DOMAIN" || { echo "The QB_DOMAIN repository variable is not set."; exit 1; }
          printf 'DOMAIN=%s\nJWT_KEY=%s\nCLAUDE_API_KEY=%s\nCERT_EMAIL=%s\n' \
              "$DOMAIN" "$JWT_KEY" "$CLAUDE_API_KEY" "$CERT_EMAIL" \
            | ~/.ssh/ssh-deploy "${DEPLOY_USER:-root}@$DEPLOY_HOST" 'bash /srv/quillbridge-release/deploy/server-setup.sh'

      - name: Check the site answers from outside
        env:
          DOMAIN: ${{ vars.QB_DOMAIN }}
        # -L follows the HTTP→HTTPS redirect once there is a certificate
        run: curl -fsSL --retry 5 --retry-delay 3 --max-time 20 "http://$DOMAIN/api/health"

      - name: Clean up the credentials
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/deploy_pass
