# Quillbridge — the server-level part shared by the HTTP and HTTPS configs: the Vite build and the API.
# Installed to /etc/nginx/quillbridge-app.conf by deploy/server-setup.sh.

# CSV imports of prospect lists
client_max_body_size 20m;
server_tokens off;

access_log /var/log/nginx/quillbridge.access.log;
error_log  /var/log/nginx/quillbridge.error.log;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

location ~ /\. {
    deny all;
    access_log off;
}

location /api/ {
    limit_req zone=quillbridge_api burst=60 nodelay;

    proxy_pass http://127.0.0.1:5100;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # guide generation calls Claude and can take a while
    proxy_read_timeout 300s;
}

# the seeded accounts share a known password, so slow down guessing. A case-insensitive regex because
# ASP.NET routes are case-insensitive and a prefix match on /api/Auth/ would miss /api/auth/.
location ~* ^/api/auth/ {
    limit_req zone=quillbridge_auth burst=10 nodelay;

    proxy_pass http://127.0.0.1:5100;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

root /var/www/quillbridge/web;
index index.html;

# Vite's hashed bundles
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
}

location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}

# client-side routing
location / {
    try_files $uri $uri/ /index.html;
}
