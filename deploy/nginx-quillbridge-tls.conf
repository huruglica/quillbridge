# Quillbridge on __DOMAIN__ — HTTPS, once /etc/letsencrypt/live/__DOMAIN__/fullchain.pem exists.
# Installed as /etc/nginx/conf.d/quillbridge.conf by deploy/server-setup.sh; do not hand-edit.
# Certificates are `certbot certonly --webroot`, so certbot never rewrites this file; renewal reuses
# StockFlow's certbot timer and its reload-nginx hook.

limit_req_zone $binary_remote_addr zone=quillbridge_api:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=quillbridge_auth:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 308 keeps the method and body of an API POST; 301 may turn it into a GET
    location /api/ {
        return 308 https://__DOMAIN__$request_uri;
    }

    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}

server {
    # same `listen ... http2` form as StockFlow's config: mixing it with `http2 on;` on one port warns
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=15552000" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/quillbridge-app.conf;
}
